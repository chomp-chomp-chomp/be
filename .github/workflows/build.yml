name: Build site

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'views/**'
      - 'public/**'
      - 'admin/**'
      - 'build.js'
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build
        env:
          ADMIN_PW_HASH: ${{ secrets.ADMIN_PW_HASH }}

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Build: regenerate docs [skip ci]"
          git push
