name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - 'public/admin/index.html'
      - 'public/email-converter/index.html'
      - 'public/pages/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          postCommands: |
            wrangler kv key put --binding POSTS "admin-html" --path public/admin/index.html
            wrangler kv key put --binding POSTS "email-converter-html" --path public/email-converter/index.html
            find public/pages -name '*.html' -print0 | while IFS= read -r -d '' f; do
              key="page:${f#public/pages/}"; key="${key%.html}"
              echo "Uploading $f → KV key: $key"
              wrangler kv key put --binding POSTS "$key" --path "$f"
            done
